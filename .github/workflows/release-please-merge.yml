name: Release Please Merge

on:
  workflow_call:
    inputs:
      update-source-status:
        description: "Atualiza o comentario de origem e finaliza a release no piloto"
        type: boolean
        required: false
        default: false
    outputs:
      release-pr-number:
        description: "Numero da pull request de release encontrada"
        value: ${{ jobs.merge.outputs.release-pr-number }}
      merge-requested:
        description: "Indica se o GitHub aceitou a solicitacao de merge"
        value: ${{ jobs.merge.outputs.merge-requested }}
    secrets:
      BOT_APP_ID:
        description: "ID do GitHub App usado para aprovar e mergear a PR de release quando a ruleset exige aprovação. Opcional: sem ele, o fluxo usa RELEASE_BOT_TOKEN ou só pede o auto-merge."
        required: false
      BOT_APP_PRIVATE_KEY:
        description: "Chave privada (.pem) do GitHub App informado em BOT_APP_ID."
        required: false
      RELEASE_BOT_TOKEN:
        description: "Legado: token de uma conta diferente de github-actions[bot]. Só é usado quando o GitHub App não está configurado."
        required: false

jobs:
  merge:
    runs-on: ubuntu-latest
    outputs:
      release-pr-number: ${{ steps.merge.outputs.release-pr-number }}
      merge-requested: ${{ steps.merge.outputs.merge-requested }}
    permissions:
      contents: write
      pull-requests: write
    env:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
    steps:
      - name: Generate bot app token
        id: app-token
        if: ${{ env.BOT_APP_ID != '' }}
        uses: actions/create-github-app-token@v2
        continue-on-error: true
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Merge an authorized release command
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.sender.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          UPDATE_SOURCE_STATUS: ${{ inputs.update-source-status }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BOT_TOKEN: ${{ secrets.RELEASE_BOT_TOKEN }}
        run: |
          MERGE_REQUESTED=false

          if [[ "$COMMENT_BODY" == "/release" ]]; then
            head_ref=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
            if [[ "$head_ref" != release-please--* ]]; then
              echo "pr $PR_NUMBER não é uma pr de release, pulando."
              exit 0
            fi
          elif [[ "$COMMENT_BODY" == *"- [x] **Clique aqui para publicar a release automaticamente!**"* ]]; then
            # Comando via checkbox: postado na PR original, não na PR de release em si.
            # Descobre a PR de release atualmente aberta pra mergear.
            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --base main --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number')
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
              echo "Nenhuma pr de release aberta, pulando."
              exit 0
            fi
          else
            echo "Comentário não é o comando de release, pulando."
            exit 0
          fi

          RELEASE_PR_NUMBER="$PR_NUMBER"
          echo "release-pr-number=$RELEASE_PR_NUMBER" >> "$GITHUB_OUTPUT"

          permission=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq '.permission')
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "$ACTOR não tem permissão para publicar uma release."
              exit 1
              ;;
          esac

          update_source_comment() {
            local status_line="$1"
            local body comment_id
            body=$(printf '%s\n' \
              "## Release semântico automático" \
              "" \
              "$status_line" \
              "" \
              "<!-- release-please-source-command -->")
            comment_id=$(gh api "repos/${{ github.repository }}/issues/$SOURCE_PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- release-please-source-command -->")) | .id' | head -n 1)
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$body"
            else
              gh pr comment "$SOURCE_PR_NUMBER" --repo "${{ github.repository }}" --body "$body"
            fi
          }

          if [ "$UPDATE_SOURCE_STATUS" = "true" ]; then
            command_comment_id=$(gh api "repos/${{ github.repository }}/issues/$RELEASE_PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- release-please-command -->")) | .id' | head -n 1)
            if [ -z "$command_comment_id" ]; then
              command_comment=$(printf '%s\n' \
                "## Release pronta" \
                "" \
                "Esta pull request reúne os commits já integrados em \`main\` desde a última publicação, com o changelog atualizado." \
                "" \
                "## Como publicar" \
                "" \
                "Comente \`/release\` nesta pull request. Quem tem permissão de escrita no repositório aciona a aprovação e o merge automáticos; a tag e a release são criadas logo depois do merge." \
                "" \
                "## Depois da publicação" \
                "" \
                "Se o repositório tiver \`Dockerfile\`, a imagem é publicada a partir da \`main\`, e o comentário da pull request original passa a mostrar o link da release." \
                "" \
                "<!-- release-please-command -->")
              gh pr comment "$RELEASE_PR_NUMBER" --repo "${{ github.repository }}" --body "$command_comment"
              command_comment_id=$(gh api "repos/${{ github.repository }}/issues/$RELEASE_PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- release-please-command -->")) | .id' | head -n 1)
            else
              command_comment=$(gh api "repos/${{ github.repository }}/issues/comments/$command_comment_id" --jq '.body')
            fi

            if ! grep -Fq '<!-- release-please-auto-publish-requested -->' <<< "$command_comment"; then
              command_comment+=$'\n<!-- release-please-auto-publish-requested -->'
            fi
            if [ -n "${SOURCE_PR_NUMBER:-}" ]; then
              source_marker="<!-- release-please-auto-publish-source:$SOURCE_PR_NUMBER -->"
              if ! grep -Fq "$source_marker" <<< "$command_comment"; then
                command_comment+=$'\n'"$source_marker"
              fi
            fi
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$command_comment_id" -f body="$command_comment"
          fi

          # A PR de release é aberta por github-actions[bot], que não pode aprovar a própria PR.
          # Com o token do GitHub App (ou RELEASE_BOT_TOKEN, legado), que é outra identidade,
          # a aprovação exigida pela ruleset é dada aqui, somente depois da checagem de permissão
          # de quem pediu a release.
          # Secrets colados com quebra de linha/espaço no fim invalidam o header Authorization.
          RELEASE_BOT_TOKEN=$(printf '%s' "${APP_TOKEN:-${RELEASE_BOT_TOKEN:-}}" | tr -d '[:space:]')

          release_gh() {
            GH_TOKEN="${RELEASE_BOT_TOKEN:-$GH_TOKEN}" gh "$@"
          }

          approve_failed=false
          if [ -n "${RELEASE_BOT_TOKEN:-}" ]; then
            release_gh pr review "$RELEASE_PR_NUMBER" --repo "${{ github.repository }}" --approve               || { echo "Não foi possível aprovar a PR de release com o token do bot; seguindo sem aprovação."; approve_failed=true; }
          fi

          if release_gh pr merge "$RELEASE_PR_NUMBER" --repo "${{ github.repository }}" --squash --auto; then
            MERGE_REQUESTED=true
            if [ "$UPDATE_SOURCE_STATUS" = "true" ] && [ -n "${SOURCE_PR_NUMBER:-}" ]; then
              release_pr_url="https://github.com/${{ github.repository }}/pull/$RELEASE_PR_NUMBER"
              update_source_comment "A publicação automática foi solicitada. O merge aguarda os checks e aprovações exigidos: [PR da release]($release_pr_url)."
            fi
          elif [ "$UPDATE_SOURCE_STATUS" != "true" ]; then
            echo "Auto-merge indisponível; tentando squash merge imediato."
            release_gh pr merge "$RELEASE_PR_NUMBER" --repo "${{ github.repository }}" --squash
            MERGE_REQUESTED=true
          elif release_gh pr merge "$RELEASE_PR_NUMBER" --repo "${{ github.repository }}" --squash; then
            MERGE_REQUESTED=true
            if [ -n "${SOURCE_PR_NUMBER:-}" ]; then
              release_pr_url="https://github.com/${{ github.repository }}/pull/$RELEASE_PR_NUMBER"
              update_source_comment "A PR da release foi mergeada; o workflow vai concluir a publicação: [PR da release]($release_pr_url)."
            fi
          else
            merge_state=$(gh pr view "$RELEASE_PR_NUMBER" --repo "${{ github.repository }}" --json mergeStateStatus --jq '.mergeStateStatus')
            if [ -n "${SOURCE_PR_NUMBER:-}" ]; then
              release_pr_url="https://github.com/${{ github.repository }}/pull/$RELEASE_PR_NUMBER"
              note=""
              if [ "$approve_failed" = "true" ]; then note=" O token do bot foi recusado pelo GitHub (credencial inválida ou expirada), então a aprovação automática não aconteceu."; fi
              update_source_comment "O GitHub não aceitou o auto-merge (estado: $merge_state).$note Confira os checks e as aprovações na [PR da release]($release_pr_url)."
            fi
          fi

          echo "release-pr-number=$RELEASE_PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "merge-requested=$MERGE_REQUESTED" >> "$GITHUB_OUTPUT"
