name: Release Please Merge

on:
  workflow_call:

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge an authorized release command
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
          ACTOR: ${{ github.event.sender.login }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          if [[ "$COMMENT_BODY" == "/release" ]]; then
            head_ref=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json headRefName --jq '.headRefName')
            if [[ "$head_ref" != release-please--* ]]; then
              echo "pr $PR_NUMBER não é uma pr de release, pulando."
              exit 0
            fi
          elif [[ "$COMMENT_BODY" == *"- [x] **Clique aqui para publicar a release automaticamente!**"* ]]; then
            # Comando via checkbox: postado na PR original, não na PR de release em si.
            # Descobre a PR de release atualmente aberta pra mergear.
            PR_NUMBER=$(gh pr list --repo "${{ github.repository }}" --base main --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number')
            if [ -z "$PR_NUMBER" ] || [ "$PR_NUMBER" == "null" ]; then
              echo "Nenhuma pr de release aberta, pulando."
              exit 0
            fi
          else
            echo "Comentário não é o comando de release, pulando."
            exit 0
          fi

          permission=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq '.permission')
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "$ACTOR não tem permissão para publicar uma release."
              exit 1
              ;;
          esac

          if ! gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash --auto; then
            echo "Auto-merge indisponível; tentando squash merge imediato."
            gh pr merge "$PR_NUMBER" --repo "${{ github.repository }}" --squash
          fi
