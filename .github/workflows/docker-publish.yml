name: Docker Publish

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Detect a release commit
        id: release
        run: |
          subject=$(git log -1 --format=%s)
          pattern='^chore\(main\): release ([A-Za-z0-9._-]+ )?([0-9]+\.[0-9]+\.[0-9]+)'
          if [[ "$subject" =~ $pattern ]]; then
            echo "version=${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
            echo "extra_tag=solarianetwork/${{ github.event.repository.name }}:${BASH_REMATCH[2]}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for Dockerfile
        id: check
        run: |
          if [ -f Dockerfile ]; then
            echo "has_dockerfile=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dockerfile=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        if: steps.check.outputs.has_dockerfile == 'true'
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        id: build
        if: steps.check.outputs.has_dockerfile == 'true'
        with:
          context: .
          push: true
          tags: |
            solarianetwork/${{ github.event.repository.name }}:latest
            solarianetwork/${{ github.event.repository.name }}:${{ github.sha }}
            ${{ steps.release.outputs.extra_tag }}

      - name: Comment image info on PR
        if: steps.check.outputs.has_dockerfile == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [ -z "$pr_number" ]; then
            echo "Nenhuma PR associada a este commit, pulando comentário."
            exit 0
          fi

          repo_name="${{ github.event.repository.name }}"
          body=$(printf '%s\n' \
            "## Imagem Docker publicada" \
            '' \
            "A imagem desta pull request foi publicada no [Docker Hub](https://hub.docker.com/repositories/solarianetwork) com sucesso! Ela está disponível na conta \`solarianetwork\` e abaixo estão as informações da imagem." \
            '' \
            "- **Tag**: \`solarianetwork/${repo_name}:${{ github.sha }}\`" \
            '' \
            "- **Digest**: \`${{ steps.build.outputs.digest }}\`" \
            '' \
            "- **Registry**: https://hub.docker.com/r/solarianetwork/${repo_name}/tags")

          gh pr comment "$pr_number" --repo "${{ github.repository }}" --body "$body"

  gitops-bump:
    needs: publish
    if: needs.publish.outputs.version != ''
    permissions:
      contents: read
      pull-requests: write
    uses: Solierrr/.github/.github/workflows/gitops-bump.yml@main
    with:
      service: ${{ github.event.repository.name }}
      version: ${{ needs.publish.outputs.version }}
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}
