name: Sync main <> QA

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base qa \
            --head main \
            --title "[AUTO] chore: sync main into qa" \
            --body "$(printf '# `[AUTO]`\n\nSincronização automática de main <> qa')" \
            || echo "PR já existe ou não há mudanças a serem feitas."