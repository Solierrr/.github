name: Sync main <> QA

on:
  workflow_call:
    inputs:
      source-pr-number:
        description: "Numero da pull request que disparou a sincronizacao, para referencia cruzada"
        type: string
        required: false
        default: ""
      auto-merge:
        description: "Solicita o auto-merge da PR de sync depois do clique na checkbox"
        type: boolean
        required: false
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create sync PR
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR_NUMBER: ${{ inputs.source-pr-number }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
        run: |
          body=$(printf '%s\n' \
            '## Objetivo' \
            '' \
            'Manter o ambiente de QA alinhado com o que já foi integrado em main, evitando que a branch qa fique defasada em relação ao que está de fato aprovado e mergeado.' \
            '' \
            '## Alterações' \
            '' \
            'Esta PR reúne exclusivamente os commits que já existem em main e ainda não chegaram em qa; ela não introduz nenhuma mudança de conteúdo própria, é só uma sincronização mecânica entre as duas branches.' \
            '' \
            '## Recursos impactados' \
            '' \
            'Depois do merge, o ambiente de QA passa a rodar exatamente o mesmo código que já está validado em main, então qualquer serviço fazendo deploy a partir de qa reflete essa atualização.' \
            '' \
            '## Rollback' \
            '' \
            'Basta fechar esta PR sem mergear para manter qa no estado atual; como nenhuma mudança é aplicada até o merge, não há nada pra reverter depois disso.' \
            '' \
            '## Como validar' \
            '' \
            'Confirme que o diff mostra apenas os commits esperados vindos de main e que os checks obrigatórios da PR passaram antes de mergear.')

          gh pr create \
            --base qa \
            --head main \
            --title "chore(sync): synchronize main into qa" \
            --body "$body" \
            2>/dev/null || true

          pr_number=$(gh pr list --repo "${{ github.repository }}" --base qa --head main --state open --json number --jq '.[0].number')
          echo "pr_number=$pr_number" >> "$GITHUB_OUTPUT"

          if [ -n "$SOURCE_PR_NUMBER" ] && [ -n "$pr_number" ]; then
            current_body=$(gh pr view "$pr_number" --repo "${{ github.repository }}" --json body --jq '.body')
            if ! grep -q "Relacionado a #$SOURCE_PR_NUMBER\." <<< "$current_body"; then
              updated_body=$(printf '%s\n\nRelacionado a #%s.' "$current_body" "$SOURCE_PR_NUMBER")
              gh pr edit "$pr_number" --repo "${{ github.repository }}" --body "$updated_body"
            fi
          fi

      - name: Update the checkbox comment on the source pull request
        if: inputs.source-pr-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR_NUMBER: ${{ inputs.source-pr-number }}
          SYNC_PR_NUMBER: ${{ steps.sync.outputs.pr_number }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
        run: |
          if [ -z "$SYNC_PR_NUMBER" ] || [ "$SYNC_PR_NUMBER" = "null" ]; then
            ahead_by=$(gh api "repos/${{ github.repository }}/compare/qa...main" --jq '.ahead_by')
            if [ "$ahead_by" = "0" ]; then
              status_line="A branch \`qa\` já está sincronizada com \`main\`; não havia PR para mergear."
            else
              status_line="Não foi possível localizar ou criar a PR de sincronização. Confira a execução do workflow."
            fi
            body=$(printf '%s\n' \
              "## Sincronização de branches" \
              "" \
              "$status_line" \
              "" \
              "- [x] **Sincronizar automaticamente a branch \`qa\`**" \
              "" \
              "<!-- qa-sync-source-command -->")
          elif [ "$AUTO_MERGE" = "true" ]; then
            sync_pr_url="https://github.com/${{ github.repository }}/pull/$SYNC_PR_NUMBER"
            if gh pr merge "$SYNC_PR_NUMBER" --repo "${{ github.repository }}" --squash --auto; then
              merged_at=$(gh pr view "$SYNC_PR_NUMBER" --repo "${{ github.repository }}" --json mergedAt --jq '.mergedAt // empty')
              if [ -n "$merged_at" ]; then
                status_line="A sincronização foi concluída e a branch \`qa\` já está atualizada. [PR da sincronização]($sync_pr_url)."
              else
                status_line="O auto-merge foi solicitado; o GitHub concluirá a sincronização quando os checks e aprovações exigidos passarem. [PR da sincronização]($sync_pr_url)."
              fi
            else
              mergeable=$(gh pr view "$SYNC_PR_NUMBER" --repo "${{ github.repository }}" --json mergeable --jq '.mergeable')
              merge_state=$(gh pr view "$SYNC_PR_NUMBER" --repo "${{ github.repository }}" --json mergeStateStatus --jq '.mergeStateStatus')
              if [ "$mergeable" = "CONFLICTING" ]; then
                status_line="Não foi possível sincronizar automaticamente por conflito entre \`main\` e \`qa\`. Resolva o conflito na [PR da sincronização]($sync_pr_url)."
              else
                status_line="O GitHub não aceitou o auto-merge (estado: $merge_state). Confira os checks e as regras na [PR da sincronização]($sync_pr_url)."
              fi
            fi

            body=$(printf '%s\n' \
              "## Sincronização de branches" \
              "" \
              "$status_line" \
              "" \
              "- [x] **Sincronizar automaticamente a branch \`qa\`**" \
              "" \
              "<!-- qa-sync-source-command -->")
          else
            sync_pr_url="https://github.com/${{ github.repository }}/pull/$SYNC_PR_NUMBER"
            body=$(printf '%s\n' \
              "## Sincronização de branches" \
              "" \
              "A pull request de sincronização foi aberta: [pull request da sincronização]($sync_pr_url). Marque a caixa abaixo para mergeá-la automaticamente e atualizar a branch \`qa\` — se houver conflito com \`main\`, um comentário aqui avisa que não deu pra mergear sozinho." \
              "" \
              "- [x] **Sincronizar automaticamente a branch \`qa\`**" \
              "- [ ] **Mergear automaticamente a pull request de sincronização**" \
              "" \
              "<!-- qa-sync-source-command -->")
          fi

          comment_id=$(gh api "repos/${{ github.repository }}/issues/$SOURCE_PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- qa-sync-source-command -->")) | .id' | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$body"
          else
            gh pr comment "$SOURCE_PR_NUMBER" --repo "${{ github.repository }}" --body "$body"
          fi
