name: Sync main <> QA

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '%s\n' \
            '## Objetivo' \
            '' \
            'Manter qa alinhada com as alterações já integradas em main.' \
            '' \
            '## Alterações' \
            '' \
            'Esta PR reúne somente commits presentes em main e ainda ausentes em qa; não introduz mudanças independentes.' \
            '' \
            '## Recursos impactados' \
            '' \
            'Após o merge, o ambiente de QA passa a conter as mesmas alterações já aprovadas em main.' \
            '' \
            '## Rollback' \
            '' \
            'Fechar esta PR sem mergear mantém qa no estado atual.' \
            '' \
            '## Como validar' \
            '' \
            'Confirmar que o diff contém apenas alterações esperadas de main e que os checks obrigatórios passaram.')

          gh pr create \
            --base qa \
            --head main \
            --title "chore(sync): synchronize main into qa" \
            --body "$body" \
            || echo "PR já existe ou não há mudanças a serem feitas."
