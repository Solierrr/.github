name: Sync main <> QA

on:
  workflow_call:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create sync PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body=$(printf '%s\n' \
            '> ⚠️ Esta PR foi aberta automaticamente pelo workflow `qa-sync`. Nao edite a descricao manualmente - ela e sobrescrita na proxima sincronizacao.' \
            '' \
            '## Objetivo' \
            '' \
            'Sincronizar main para qa, mantendo o ambiente de QA alinhado com o que ja foi mergeado em main.' \
            '' \
            '## Alteracoes' \
            '' \
            'Tudo que ja esta em main e ainda nao chegou em qa.' \
            '' \
            '## Recursos impactados' \
            '' \
            'Nenhum diretamente - esta PR so atualiza a branch qa. Sem impacto ate ela ser mergeada.' \
            '' \
            '## Rollback' \
            '' \
            'Fechar esta PR sem mergear.' \
            '' \
            '## Como validar' \
            '' \
            'Revisar o diff antes de aprovar.' \
            '' \
            'Closes #')

          gh pr create \
            --base qa \
            --head main \
            --title "[AUTO] chore: sync main into qa" \
            --body "$body" \
            || echo "PR já existe ou não há mudanças a serem feitas."