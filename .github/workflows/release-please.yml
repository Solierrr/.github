name: Release Please

on:
  workflow_call:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Add release command to the release pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list --repo "${{ github.repository }}" --base main --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number')
          if [ -z "$pr_number" ] || [ "$pr_number" == "null" ]; then
            echo "Nenhuma pr de release aberta, pulando comentário."
            exit 0
          fi

          body=$'### Release pronta\n\nPara aprovar a publicação, envie um novo comentário com `/release` neste PR.\n\n<!-- release-please-command -->'
          comment_id=$(gh api "repos/${{ github.repository }}/issues/$pr_number/comments" --paginate --jq '.[] | select(.body | contains("<!-- release-please-command -->") or contains("Fazer release")) | .id' | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$body"
          else
            gh pr comment "$pr_number" --repo "${{ github.repository }}" --body "$body"
          fi
