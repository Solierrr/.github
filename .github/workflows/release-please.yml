name: Release Please

on:
  workflow_call:

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Restructure the release published comment
        if: steps.rp.outputs.release_created == 'true' || steps.rp.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.rp.outputs.tag_name }}
          RELEASE_URL: ${{ steps.rp.outputs.html_url }}
        run: |
          pr_number=$(gh pr list --repo "${{ github.repository }}" --base main --state merged --limit 10 --json number,headRefName --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number')
          if [ -z "$pr_number" ] || [ "$pr_number" == "null" ]; then
            echo "Nenhuma pr de release mergeada encontrada, pulando."
            exit 0
          fi

          comment_id=$(gh api "repos/${{ github.repository }}/issues/$pr_number/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("🤖 Created releases"))) | .id' | head -n 1)
          if [ -z "$comment_id" ]; then
            echo "Comentário padrão do release-please não encontrado, pulando."
            exit 0
          fi

          body=$(printf '%s\n' \
            "## Release publicada" \
            "" \
            "A release [$TAG_NAME]($RELEASE_URL) foi criada a partir desta pull request." \
            "" \
            "## O que foi publicado" \
            "" \
            "A tag \`$TAG_NAME\` foi criada em \`main\` e a página da release traz o changelog desta versão." \
            "" \
            "## Próximos passos" \
            "" \
            "Se o repositório tiver \`Dockerfile\`, a imagem é publicada pelo workflow \`Release\` a partir da \`main\`." \
            "" \
            "<!-- release-please-published -->")

          gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$body"

      - name: Add release command to the release pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list --repo "${{ github.repository }}" --base main --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number')
          if [ -z "$pr_number" ] || [ "$pr_number" == "null" ]; then
            echo "Nenhuma pr de release aberta, pulando comentário."
            exit 0
          fi

          body=$(printf '%s\n' \
            "## Release pronta" \
            "" \
            "Esta pull request reúne os commits já integrados em \`main\` desde a última publicação, com o changelog atualizado." \
            "" \
            "## Como publicar" \
            "" \
            "Comente \`/release\` nesta pull request. Quem tem permissão de escrita no repositório aciona a aprovação e o merge automáticos; a tag e a release são criadas logo depois do merge." \
            "" \
            "## Depois da publicação" \
            "" \
            "Se o repositório tiver \`Dockerfile\`, a imagem é publicada a partir da \`main\`, e o comentário da pull request original passa a mostrar o link da release." \
            "" \
            "<!-- release-please-command -->")
          comment_id=$(gh api "repos/${{ github.repository }}/issues/$pr_number/comments" --paginate --jq '.[] | select(.body | contains("<!-- release-please-command -->") or contains("Fazer release")) | .id' | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$body"
          else
            gh pr comment "$pr_number" --repo "${{ github.repository }}" --body "$body"
          fi

      - name: Comment on the source pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_number=$(gh pr list --repo "${{ github.repository }}" --base main --state open --json number,headRefName --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number')
          if [ -z "$pr_number" ] || [ "$pr_number" == "null" ]; then
            echo "Nenhuma pr de release aberta, pulando comentário na pr original."
            exit 0
          fi

          source_pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number')
          if [ -z "$source_pr" ] || [ "$source_pr" == "null" ]; then
            echo "Nenhuma pr associada a este commit, pulando comentário."
            exit 0
          fi

          release_pr_url="https://github.com/${{ github.repository }}/pull/$pr_number"
          body=$(printf '%s\n' \
            "## Release semântico automático" \
            "" \
            "Uma pull request de release foi aberta ou atualizada: #$pr_number. Marque a caixa abaixo para aprovar a publicação ou, se achar necessário, acesse diretamente a [pull request da release]($release_pr_url)." \
            "" \
            "- [ ] **Clique aqui para publicar a release automaticamente!**" \
            "" \
            "<!-- release-please-source-command -->")

          comment_id=$(gh api "repos/${{ github.repository }}/issues/$source_pr/comments" --paginate --jq '.[] | select(.body | contains("<!-- release-please-source-command -->")) | .id' | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$body"
          else
            gh pr comment "$source_pr" --repo "${{ github.repository }}" --body "$body"
          fi
