name: Sync main <> QA Merge

on:
  workflow_call:
    inputs:
      source-pr-number:
        description: "Numero da pull request original, onde o comentario de status fica"
        type: string
        required: true

jobs:
  merge:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Merge an authorized sync command
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR_NUMBER: ${{ inputs.source-pr-number }}
          ACTOR: ${{ github.event.sender.login }}
        run: |
          permission=$(gh api "repos/${{ github.repository }}/collaborators/$ACTOR/permission" --jq '.permission')
          case "$permission" in
            admin|maintain|write) ;;
            *)
              echo "$ACTOR não tem permissão para sincronizar qa."
              exit 1
              ;;
          esac

          sync_pr=$(gh pr list --repo "${{ github.repository }}" --base qa --head main --state open --json number --jq '.[0].number')
          if [ -z "$sync_pr" ] || [ "$sync_pr" == "null" ]; then
            echo "Nenhuma pull request de sincronização aberta, nada para mergear."
            exit 0
          fi

          sync_pr_url="https://github.com/${{ github.repository }}/pull/$sync_pr"

          if gh pr merge "$sync_pr" --repo "${{ github.repository }}" --merge; then
            status_line="A pull request de sincronização foi mergeada com sucesso. A branch \`qa\` já está atualizada."
          else
            status_line="Não foi possível mergear automaticamente — há conflitos entre \`main\` e \`qa\`. Resolva manualmente na [pull request da sincronização]($sync_pr_url)."
          fi

          body=$(printf '%s\n' \
            "## Sincronização de branches" \
            "" \
            "$status_line" \
            "" \
            "<!-- qa-sync-source-command -->")

          comment_id=$(gh api "repos/${{ github.repository }}/issues/$SOURCE_PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- qa-sync-source-command -->")) | .id' | head -n 1)

          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$body"
          else
            gh pr comment "$SOURCE_PR_NUMBER" --repo "${{ github.repository }}" --body "$body"
          fi
