name: Finalize Release Please

on:
  workflow_call:
    inputs:
      release-pr-number:
        description: "Numero da pull request de release a finalizar"
        type: string
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    concurrency:
      group: release-finalize-${{ inputs.release-pr-number }}
      cancel-in-progress: false
    steps:
      - name: Wait for the release pull request and read its source commands
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.release-pr-number }}
        run: |
          pr_json=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json state,mergedAt,headRefName,url)
          head_ref=$(jq -r '.headRefName' <<< "$pr_json")
          if [[ "$head_ref" != release-please--* ]]; then
            echo "A PR $PR_NUMBER não é uma PR do Release Please."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          command_comment=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- release-please-command -->") and contains("<!-- release-please-auto-publish-requested -->")) | .body' | head -n 1)
          if [ -z "$command_comment" ]; then
            echo "Esta PR não tem um pedido automático de publicação."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Fq '<!-- release-please-auto-published -->' <<< "$command_comment"; then
            echo "A publicação desta PR já foi finalizada."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          source_prs=$(gh api "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" --paginate --jq '[.[] | select(.body | contains("<!-- release-please-command -->") and contains("<!-- release-please-auto-publish-requested -->")) | .body | scan("<!-- release-please-auto-publish-source:([0-9]+) -->")[0]] | unique | .[]')

          attempt=0
          while [ -z "$(jq -r '.mergedAt // empty' <<< "$pr_json")" ] && [ "$(jq -r '.state' <<< "$pr_json")" = "OPEN" ] && [ "$attempt" -lt 60 ]; do
            sleep 15
            attempt=$((attempt + 1))
            pr_json=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json state,mergedAt,headRefName,url)
          done

          release_url=$(jq -r '.url' <<< "$pr_json")
          merged_at=$(jq -r '.mergedAt // empty' <<< "$pr_json")
          state=$(jq -r '.state' <<< "$pr_json")
          {
            echo "source-prs<<EOF"
            echo "$source_prs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "release-url=$release_url" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"

          if [ -n "$merged_at" ]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
            echo "merged=false" >> "$GITHUB_OUTPUT"
            echo "Release PR terminou sem merge ou ainda aguarda as regras obrigatórias (estado: $state)."
          fi

      - name: Check out the merged default branch
        if: steps.release.outputs.eligible == 'true' && steps.release.outputs.merged == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Publish the merged release
        id: publish
        if: steps.release.outputs.eligible == 'true' && steps.release.outputs.merged == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      - name: Restructure the release published comment
        if: steps.release.outputs.merged == 'true' && steps.publish.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.publish.outputs.tag_name }}
          RELEASE_URL: ${{ steps.publish.outputs.html_url }}
        run: |
          pr_number=$(gh pr list --repo "${{ github.repository }}" --base main --state merged --limit 10 --json number,headRefName --jq '[.[] | select(.headRefName | startswith("release-please--"))][0].number')
          if [ -z "$pr_number" ] || [ "$pr_number" == "null" ]; then
            echo "Nenhuma pr de release mergeada encontrada, pulando."
            exit 0
          fi

          comment_id=$(gh api "repos/${{ github.repository }}/issues/$pr_number/comments" --paginate --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith("🤖 Created releases"))) | .id' | head -n 1)
          if [ -z "$comment_id" ]; then
            echo "Comentário padrão do release-please não encontrado, pulando."
            exit 0
          fi

          body=$(printf '%s\n' \
            "## Release publicada" \
            "" \
            "A release [$TAG_NAME]($RELEASE_URL) foi criada a partir desta pull request." \
            "" \
            "## O que foi publicado" \
            "" \
            "A tag \`$TAG_NAME\` foi criada em \`main\` e a página da release traz o changelog desta versão." \
            "" \
            "## Próximos passos" \
            "" \
            "Se o repositório tiver \`Dockerfile\`, a imagem é publicada pelo workflow \`Release\` a partir da \`main\`." \
            "" \
            "<!-- release-please-published -->")

          gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$body"

      - name: Update the source comments with the publication result
        if: steps.release.outputs.eligible == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PRS: ${{ steps.release.outputs.source-prs }}
          RELEASE_PR_NUMBER: ${{ inputs.release-pr-number }}
          RELEASE_PR_URL: ${{ steps.release.outputs.release-url }}
          MERGED: ${{ steps.release.outputs.merged }}
          RELEASE_CREATED: ${{ steps.publish.outputs.release_created }}
          RELEASE_TAG: ${{ steps.publish.outputs.tag_name }}
          RELEASE_URL: ${{ steps.publish.outputs.html_url }}
          PR_STATE: ${{ steps.release.outputs.state }}
        run: |
          if [ "$MERGED" != "true" ]; then
            if [ "$PR_STATE" = "OPEN" ]; then
              status_line="O auto-merge continua aguardando as regras obrigatórias do GitHub; a publicação ainda não foi realizada. [PR da release]($RELEASE_PR_URL)."
            else
              status_line="A PR de release foi fechada sem merge. A publicação automática não foi realizada. [PR da release]($RELEASE_PR_URL)."
            fi
          elif [ "$RELEASE_CREATED" = "true" ]; then
            if [ -z "$RELEASE_URL" ]; then
              RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/$RELEASE_TAG"
            fi
            status_line="A publicação foi concluída: [release $RELEASE_TAG]($RELEASE_URL). [PR da release]($RELEASE_PR_URL)."
            command_comment_id=$(gh api "repos/${{ github.repository }}/issues/$RELEASE_PR_NUMBER/comments" --paginate --jq '.[] | select(.body | contains("<!-- release-please-command -->") and contains("<!-- release-please-auto-publish-requested -->")) | .id' | head -n 1)
            if [ -n "$command_comment_id" ]; then
              command_comment=$(gh api "repos/${{ github.repository }}/issues/$RELEASE_PR_NUMBER/comments" --paginate --jq ".[] | select(.id == $command_comment_id) | .body")
              if ! grep -Fq '<!-- release-please-auto-published -->' <<< "$command_comment"; then
                command_comment+=$'\n<!-- release-please-auto-published -->'
                gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$command_comment_id" -f body="$command_comment"
              fi
            fi
          else
            status_line="A PR da release foi mergeada, mas a publicação ainda não foi confirmada. Confira os detalhes na [PR da release]($RELEASE_PR_URL)."
          fi

          while IFS= read -r source_pr; do
            [ -z "$source_pr" ] && continue
            body=$(printf '%s\n' \
              "## Release semântico automático" \
              "" \
              "$status_line" \
              "" \
              "<!-- release-please-source-command -->")
            comment_id=$(gh api "repos/${{ github.repository }}/issues/$source_pr/comments" --paginate --jq '.[] | select(.body | contains("<!-- release-please-source-command -->")) | .id' | head -n 1)
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$comment_id" -f body="$body"
            else
              gh pr comment "$source_pr" --repo "${{ github.repository }}" --body "$body"
            fi
          done <<< "$SOURCE_PRS"
